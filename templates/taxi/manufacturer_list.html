{% extends "base.html" %}

{% block content %}
  <h1>Manufacturers List</h1>
  {% if manufacturer_list %}
    <ul>
    {% for manufacturer in manufacturer_list %}
        <li><strong></strong> {{ manufacturer.name }}</li>
    {% endfor %}
    </ul>
    {% else %}
    <p>There are no Manufacturers to display</p>
  {% endif %}
  
{% endblock %}
